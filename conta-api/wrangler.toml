# API da conta meu-bot (conta.agentesgrok.com), a página de login (auth.agentesgrok.com) e o console da conta
# (console.agentesgrok.com/account/…), um Worker só: as páginas são os static assets em public/ (servidos conforme o
# host), a API responde no host de conta. Dois ambientes:
# o padrão é produção; `--env staging` publica em conta-staging./auth-staging., com D1 próprio (o meu-bot-staging só
# fala com o staging, nunca com produção).
#
# Secrets (wrangler secret put, por ambiente): SESSAO_HMAC_KEY (32 bytes base64, assina os tokens de acesso),
# LICENCA_PRIVATE_KEY (privada Ed25519 da licença, PKCS#8 DER base64: scripts/chave-licenca.mjs --copiar).
# Assinatura do Pro (src/rotas/pagamentos.ts), opcionais: ABACATEPAY_KEY (chave de API; no staging, a do Modo Teste),
# ABACATEPAY_WEBHOOK_SECRET (o secret do webhook v2, 32+ caracteres) e GA_MP_SECRET (api_secret do Measurement Protocol
# do fluxo Web do GA4). Sem ABACATEPAY_KEY, o webhook ou ABACATEPAY_PRODUTO, o console não mostra "Assinar".
# Leads do site (src/rotas/leads.ts), opcional: LEADS_TOKEN (32+ caracteres; quem atende lê e qualifica o código por
# visita). Sem ele, GET /leads/<código> e POST /leads/<código>/qualificar respondem 503.
# Vars (abaixo): projeto Firebase, origem da página e o e-mail do primeiro super admin.
name = "conta-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "conta.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "auth.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "console.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "www.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "agentesgrok.com.br"
custom_domain = true
[[routes]]
pattern = "www.agentesgrok.com.br"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "conta"
database_id = "f5468dd6-bd19-492c-be4b-3ba40e12f3c5"
migrations_dir = "migrations"

[vars]
CANAL = "producao"
AUTH_ORIGIN = "https://auth.agentesgrok.com"
API_ORIGIN = "https://conta.agentesgrok.com"
CONSOLE_ORIGIN = "https://console.agentesgrok.com"
SITE_ORIGIN = "https://agentesgrok.com"
# Google Analytics 4 das páginas (site, login, console): o ID de métricas do fluxo Web; vazio desliga a tag e fecha a
# CSP para scripts de fora. Uma propriedade por ambiente: produção = meu-bot-conta (criada pelo Firebase, conta
# box@agentesgrok.com); staging = agentesintegrados (diegofornalha, fluxo "agentesgrok-site-staging"). Aceita mais de
# um ID separado por vírgula, mas dois containers na mesma página duplicam o page_view: deixe um só.
GA_ID = "G-12CJ787RGJ"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
# O handler do Firebase servido aqui mesmo (/__/auth/* no Worker): popup e link funcionam no Brave e no Safari.
FIREBASE_AUTH_DOMAIN = "auth.agentesgrok.com"
ADMIN_BOOTSTRAP_EMAIL = "diegofornalha@gmail.com"
# Conta nova (primeiro login) começa em trial do Pro por estes dias; 0 desliga (começa free).
TRIAL_DIAS = "3"
# Promoção do primeiro mês do Pro: quem teve o teste grátis tem PROMO_DIAS dias, depois que ele acaba, para assinar
# pagando PROMO_PRECO_CENTAVOS na primeira cobrança (uma vez por conta, só no cartão). PROMO_CUPOM é o código do cupom
# de valor fixo criado na AbacatePay (desconto = preço cheio menos PROMO_PRECO_CENTAVOS: R$ 96,00). VAZIO = promoção
# desligada. Ligada em produção em 19 nov 2026, por decisão do dono, depois da prova no staging (#370): o cupom
# PRIMEIROMES1 existe na AbacatePay de produção. Para desligar, volte a deixar VAZIO e publique.
PROMO_CUPOM = "PRIMEIROMES1"
PROMO_PRECO_CENTAVOS = "100"
PROMO_DIAS = "3"
# Produto "meu-bot Pro mensal" (R$ 97, mensal) da loja meu-bot em produção na AbacatePay. A assinatura só liga quando
# os secrets ABACATEPAY_KEY e ABACATEPAY_WEBHOOK_SECRET também existirem neste ambiente.
ABACATEPAY_PRODUTO = "prod_3ubFY5sxLU1nG2a5GPbj5S1Q"
# Produto AVULSO (sem ciclo) "meu-bot Pro, primeiro mês", R$ 1,00, da loja em produção: o primeiro mês por Pix com o
# cupom ("Tenho um cupom" › Pix). Vazio = esse caminho fica desligado e o console oferece só o cartão.
# Ao preencher os dois ambientes, ponha a chave em DIFERENTES de tests/paridade-ambientes.test.mjs (ids próprios).
ABACATEPAY_PRODUTO_PRIMEIRO_MES = ""
ABACATEPAY_PRECO_CENTAVOS = "9700"
ABACATEPAY_METODOS = "CARD,PIX"
# Apps vendidos à parte (lerAddons, src/pagamento-core.ts): produto "meu-bot Finanças mensal" (R$ 997, mensal).
ABACATEPAY_ADDONS = '{"meu-bot-finance":{"produto":"prod_0nZWGHEd334ZBsBbmzbpxB1y","centavos":99700,"rotulo":"Finanças"}}'
# Unidades extras vendidas à parte, uma por assinatura (lerExtras): hoje a máquina extra, que soma 1 ao limite de
# máquinas da conta enquanto está paga. Formato: '{"maquina":{"produto":"prod_...","centavos":9700,"rotulo":"Máquina extra"}}'.
# VAZIO = não se vende (o console não mostra o painel "Máquinas"). Produto "meu-bot Máquina extra mensal" (R$ 97,
# mensal), criado na loja de produção em 19 nov 2026, depois de a compra ser provada no staging.
# Device extra ("meu-bot Device extra mensal", R$ 47, mensal, preço de tabela R$ 97 riscado): à venda nos dois ambientes
# desde 19 nov 2026, depois de a compra ser provada no staging.
# Módulos do Diego em produção ("meu-bot Módulos do Diego mensal", R$ 997): produto criado em 19 nov 2026,
# prod_SJJ64CXEJdhWf0PYU11EJRp1, fora do ABACATEPAY_ADDONS de produção até o dono decidir vender aqui.
ABACATEPAY_EXTRAS = '{"maquina":{"produto":"prod_Msxxa0hpGhFqpxs04wejuWYJ","centavos":9700,"rotulo":"Máquina extra"},"device":{"produto":"prod_PFUz6rnDDxWaJ1txWjTDkdaz","centavos":4700,"deCentavos":9700,"rotulo":"Device extra"}}'

[env.staging]
name = "conta-api-staging"
workers_dev = false
[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[env.staging.routes]]
pattern = "conta-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "auth-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "console-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "site-staging.agentesgrok.com"
custom_domain = true
[[env.staging.d1_databases]]
binding = "DB"
database_name = "conta-staging"
database_id = "609f1493-e49e-446e-a36b-fe98cbf91df1"
migrations_dir = "migrations"
[env.staging.vars]
CANAL = "staging"
# Produto "meu-bot Pro mensal" (R$ 97, mensal) da loja meu-bot no Modo Teste da AbacatePay. O de produção fica
# em [vars], acima.
ABACATEPAY_PRODUTO = "prod_12Das4f2bcXQtaR0bs4hrXms"
# Produto AVULSO do primeiro mês por Pix no Modo Teste (veja o de produção em [vars]). Vazio = desligado.
ABACATEPAY_PRODUTO_PRIMEIRO_MES = ""
ABACATEPAY_PRECO_CENTAVOS = "9700"
ABACATEPAY_METODOS = "CARD,PIX"
# Apps vendidos à parte, cada um com produto mensal e preço próprios (lerAddons, src/pagamento-core.ts). App novo: criar
# o produto de assinatura mensal na AbacatePay e acrescentar aqui; o nome é o do add-on da licença (meu-bot-<app>).
ABACATEPAY_ADDONS = '{"meu-bot-finance":{"produto":"prod_PLmaXSs2SJ4Zf1hY6ugwNx4H","centavos":99700,"rotulo":"Finanças"},"meu-bot-diego":{"produto":"prod_tranFZhgAaERduCZGsa3wgEB","centavos":99700,"rotulo":"Módulos do Diego"}}'
# Unidades extras vendidas à parte, uma por assinatura (lerExtras): hoje a máquina extra, que soma 1 ao limite de
# máquinas da conta enquanto está paga. Formato: '{"maquina":{"produto":"prod_...","centavos":9700,"rotulo":"Máquina extra"}}'.
# VAZIO = não se vende (o console não mostra o painel "Máquinas"). Produto "meu-bot Máquina extra mensal" (R$ 97,
# mensal), criado no Modo Teste em 19 nov 2026.
ABACATEPAY_EXTRAS = '{"maquina":{"produto":"prod_zMacfSNXKPWE6N5L4YgH31zB","centavos":9700,"rotulo":"Máquina extra"},"device":{"produto":"prod_xfHGBBR1WTgntZbsUyEjQECA","centavos":4700,"deCentavos":9700,"rotulo":"Device extra"}}'
AUTH_ORIGIN = "https://auth-staging.agentesgrok.com"
API_ORIGIN = "https://conta-staging.agentesgrok.com"
CONSOLE_ORIGIN = "https://console-staging.agentesgrok.com"
SITE_ORIGIN = "https://site-staging.agentesgrok.com"
GA_ID = "G-FCKW62SB1K"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
FIREBASE_AUTH_DOMAIN = "auth-staging.agentesgrok.com"
ADMIN_BOOTSTRAP_EMAIL = "diegofornalha@gmail.com"
# Conta nova (primeiro login) começa em trial do Pro por estes dias; 0 desliga (começa free).
TRIAL_DIAS = "3"
# Promoção do primeiro mês do Pro: quem teve o teste grátis tem PROMO_DIAS dias, depois que ele acaba, para assinar
# pagando PROMO_PRECO_CENTAVOS na primeira cobrança (uma vez por conta, só no cartão). PROMO_CUPOM é o código do cupom
# de valor fixo criado na AbacatePay (desconto = preço cheio menos PROMO_PRECO_CENTAVOS: R$ 96,00). VAZIO = promoção
# desligada. PRIMEIROMES1 é o cupom do Modo Teste (R$ 96 fixo).
PROMO_CUPOM = "PRIMEIROMES1"
PROMO_PRECO_CENTAVOS = "100"
PROMO_DIAS = "3"
