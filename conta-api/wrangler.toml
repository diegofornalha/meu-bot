# API da conta meu-bot (conta.agentesgrok.com), a página de login (auth.agentesgrok.com) e o console da conta
# (console.agentesgrok.com/account/…), um Worker só: as páginas são os static assets em public/ (servidos conforme o
# host), a API responde no host de conta. Dois ambientes:
# o padrão é produção; `--env staging` publica em conta-staging./auth-staging., com D1 próprio (o meu-bot-staging só
# fala com o staging, nunca com produção).
#
# Secrets (wrangler secret put, por ambiente): SESSAO_HMAC_KEY (32 bytes base64, assina os tokens de acesso),
# LICENCA_PRIVATE_KEY (privada Ed25519 da licença, PKCS#8 DER base64: scripts/chave-licenca.mjs --copiar).
# Vars (abaixo): projeto Firebase, origem da página e o e-mail do primeiro super admin.
name = "conta-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "conta.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "auth.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "console.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "www.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "agentesgrok.com.br"
custom_domain = true
[[routes]]
pattern = "www.agentesgrok.com.br"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "conta"
database_id = "f5468dd6-bd19-492c-be4b-3ba40e12f3c5"
migrations_dir = "migrations"

[vars]
CANAL = "producao"
AUTH_ORIGIN = "https://auth.agentesgrok.com"
API_ORIGIN = "https://conta.agentesgrok.com"
CONSOLE_ORIGIN = "https://console.agentesgrok.com"
SITE_ORIGIN = "https://agentesgrok.com"
# Google Analytics 4 das páginas (site, login, console): o ID de métricas do fluxo Web; vazio desliga a tag e fecha a
# CSP para scripts de fora. Uma propriedade por ambiente: produção = meu-bot-conta (criada pelo Firebase, conta
# box@agentesgrok.com); staging = agentesintegrados (diegofornalha, fluxo "agentesgrok-site-staging"). Aceita mais de
# um ID separado por vírgula, mas dois containers na mesma página duplicam o page_view: deixe um só.
GA_ID = "G-12CJ787RGJ"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
# O handler do Firebase servido aqui mesmo (/__/auth/* no Worker): popup e link funcionam no Brave e no Safari.
FIREBASE_AUTH_DOMAIN = "auth.agentesgrok.com"
ADMIN_BOOTSTRAP_EMAIL = "diegofornalha@gmail.com"
# Conta nova (primeiro login) começa em trial do Pro por estes dias; 0 desliga (começa free).
TRIAL_DIAS = "14"

[env.staging]
name = "conta-api-staging"
workers_dev = false
[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[env.staging.routes]]
pattern = "conta-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "auth-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "console-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "site-staging.agentesgrok.com"
custom_domain = true
[[env.staging.d1_databases]]
binding = "DB"
database_name = "conta-staging"
database_id = "609f1493-e49e-446e-a36b-fe98cbf91df1"
migrations_dir = "migrations"
[env.staging.vars]
CANAL = "staging"
AUTH_ORIGIN = "https://auth-staging.agentesgrok.com"
API_ORIGIN = "https://conta-staging.agentesgrok.com"
CONSOLE_ORIGIN = "https://console-staging.agentesgrok.com"
SITE_ORIGIN = "https://site-staging.agentesgrok.com"
GA_ID = "G-FCKW62SB1K"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
FIREBASE_AUTH_DOMAIN = "auth-staging.agentesgrok.com"
ADMIN_BOOTSTRAP_EMAIL = "diegofornalha@gmail.com"
# Conta nova (primeiro login) começa em trial do Pro por estes dias; 0 desliga (começa free).
TRIAL_DIAS = "14"
