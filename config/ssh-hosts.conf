# Modelo de máquinas do meu-bot, no formato do ~/.ssh/config.
#
# Este arquivo vai dentro do app que todo mundo instala e o repositório é público: ele fica VAZIO.
# Máquina de ninguém entra aqui (nem endereço, nem usuário). As suas máquinas ficam no ~/.ssh/config do
# seu computador; o seletor lê de lá.
#
# O botão "sincronizar ssh" do seletor copia para o ~/.ssh/config os blocos daqui que ainda não existem
# lá. Sem bloco aqui, ele não escreve nada. Formato de um bloco, para quem empacota uma versão própria:
#
# Host minha-vm
#     HostName 203.0.113.10
#     User eu
#     IdentityFile ~/.ssh/id_ed25519
