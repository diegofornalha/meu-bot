# Auto-merge ligado sozinho: PR de quem é do repo, fora de rascunho e sem marca de "não mesclar", entra quando o check
# `testes` passa e as conversas da revisão estão resolvidas (as duas travas são da proteção da main). Sem isto alguém
# precisava ligar o auto-merge PR por PR, e quem ligava cedo demais deixava a PR entrar antes dos comentários da
# Revisão Claude (a #464 entrou assim).
# Por isso quem liga é o FIM da Revisão Claude (workflow_run), não a abertura da PR. Rótulo, título e rascunho
# reavaliam: `nao-mesclar`, "NÃO MESCLAR" no título e rascunho desligam; tirar religa (se a revisão já terminou).
# A regra está em scripts/auto-merge-core.mjs (testada); este arquivo só acha a PR e chama scripts/auto-merge.mjs.
# Segurança: roda sempre o script da main (nunca o código da PR), só em branches deste repo, e o nome do branch chega
# ao shell por variável de ambiente. Não trocar para pull_request_target.
# Efeito conhecido: merge ligado com o GITHUB_TOKEN não dispara o `testes` do push na main; os testes já rodaram na PR
# e a release automática roda `npm test` antes de publicar.
name: Auto-merge

on:
  workflow_run:
    workflows: ["Revisão Claude"]
    types: [completed]
  pull_request:
    types: [labeled, unlabeled, converted_to_draft, edited]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts
      - name: Ligar ou desligar o auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name }}
          PR_DO_EVENTO: ${{ github.event.pull_request.number }}
          PR_DA_RODADA: ${{ github.event.workflow_run.pull_requests[0].number }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSAO: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENTO" = "workflow_run" ]; then
            N="$PR_DA_RODADA"
            # A rodada nem sempre traz a PR: acha pela ponta do branch.
            [ -n "$N" ] || N=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -z "$N" ]; then echo "sem PR aberta para o branch $BRANCH: nada a fazer"; exit 0; fi
            node scripts/auto-merge.mjs "$N" "--revisao=$CONCLUSAO"
          else
            node scripts/auto-merge.mjs "$PR_DO_EVENTO" --esperar-revisao
          fi
